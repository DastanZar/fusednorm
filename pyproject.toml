[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusednorm"
version = "0.1.0"
description = "Fused RMSNorm+residual-add in one Triton kernel: one HBM pass instead of three"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7"]
bench = ["triton>=3.0; platform_system=='Linux'", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["fusednorm"]

[tool.ruff]
line-length = 100
